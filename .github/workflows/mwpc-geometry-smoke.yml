name: MWPC geometry smoke test

on:
  push:
    branches:
      - feature/mwpc-dice
  workflow_dispatch:

jobs:
  geometry-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run the actual MWPC chamber source against lightweight ROOT/NA6P stubs
        shell: bash
        run: |
          set -euo pipefail
          STUBS=/tmp/mwpc-stubs
          mkdir -p "$STUBS"

          cat > "$STUBS/ConfigurableParam.h" <<'EOF'
          #pragma once
          #include <string>
          #define NA6PParamDef(classname, key) public: static classname sInstance;
          #define O2ParamImpl(classname) classname classname::sInstance;
          EOF

          cat > "$STUBS/ConfigurableParamHelper.h" <<'EOF'
          #pragma once
          namespace na6p { namespace conf {
          template <typename T>
          class ConfigurableParamHelper {
           public:
            static T& Instance() { return T::sInstance; }
          };
          }}
          EOF

          cat > "$STUBS/FakeRoot.h" <<'EOF'
          #pragma once
          #include <array>
          #include <map>
          #include <memory>
          #include <stdexcept>
          #include <string>
          #include <utility>
          #include <vector>

          constexpr int kGreen = 3;
          constexpr int kOrange = 800;
          constexpr int kCyan = 432;

          class TGeoMaterial {
           public:
            enum EGeoMaterialState { kMatStateGas = 1 };
            std::string name;
            double a = 0.;
            double z = 0.;
            double density = 0.;
            double temperature = 0.;
            EGeoMaterialState state = kMatStateGas;

            TGeoMaterial(const char* n, double aa = 0., double zz = 0., double rho = 0.)
              : name(n), a(aa), z(zz), density(rho) {}
            virtual ~TGeoMaterial() = default;
            void SetState(EGeoMaterialState s) { state = s; }
            void SetTemperature(double t) { temperature = t; }
          };

          class TGeoMixture : public TGeoMaterial {
           public:
            struct Element { double a = 0.; double z = 0.; double weight = 0.; };
            std::vector<Element> elements;
            TGeoMixture(const char* n, int nElements, double rho)
              : TGeoMaterial(n, 0., 0., rho), elements(static_cast<size_t>(nElements)) {}
            void DefineElement(int i, double aa, double zz, double weight) {
              elements.at(static_cast<size_t>(i)) = {aa, zz, weight};
            }
          };

          class TGeoMedium {
           public:
            std::string name;
            TGeoMaterial* material = nullptr;
            TGeoMedium(std::string n, TGeoMaterial* m) : name(std::move(n)), material(m) {}
          };

          class TGeoTranslation {
           public:
            double x = 0., y = 0., z = 0.;
            TGeoTranslation(double xx = 0., double yy = 0., double zz = 0.) : x(xx), y(yy), z(zz) {}
          };

          class TGeoVolume;
          struct FakeNode {
            TGeoVolume* volume = nullptr;
            int copyID = -1;
            TGeoTranslation* translation = nullptr;
          };

          class TGeoVolume {
           public:
            std::string name;
            TGeoMedium* medium = nullptr;
            double hx = 0., hy = 0., hz = 0.;
            std::vector<FakeNode> nodes;

            TGeoVolume(std::string n = {}, TGeoMedium* m = nullptr,
                       double x = 0., double y = 0., double z = 0.)
              : name(std::move(n)), medium(m), hx(x), hy(y), hz(z) {}
            virtual ~TGeoVolume() = default;
            void AddNode(TGeoVolume* v, int id, TGeoTranslation* tr = nullptr) {
              nodes.push_back({v, id, tr});
            }
            void SetLineColor(int) {}
            void SetTransparency(int) {}
          };

          class TGeoVolumeAssembly : public TGeoVolume {
           public:
            explicit TGeoVolumeAssembly(const char* n) : TGeoVolume(n) {}
          };

          class TGeoManager {
           public:
            std::vector<std::unique_ptr<TGeoVolume>> owned;
            TGeoVolume* MakeBox(const char* n, TGeoMedium* m, double hx, double hy, double hz) {
              owned.emplace_back(std::make_unique<TGeoVolume>(n, m, hx, hy, hz));
              return owned.back().get();
            }
          };

          inline TGeoManager* gGeoManager = nullptr;
          EOF

          for h in TColor.h TGeoManager.h TGeoMaterial.h TGeoMatrix.h TGeoVolume.h; do
            printf '#pragma once\n#include "FakeRoot.h"\n' > "$STUBS/$h"
          done

          cat > "$STUBS/NA6PModule.h" <<'EOF'
          #pragma once
          class NA6PModule {
           public:
            static constexpr int MaxVolID = 1000;
            static constexpr int MaxNonSensID = 300;
            int composeSensorVolID(int id) const { return MaxNonSensID + id; }
            int composeNonSensorVolID(int id) const { return id; }
          };
          EOF

          cat > "$STUBS/NA6PTGeoHelper.h" <<'EOF'
          #pragma once
          #include "FakeRoot.h"
          #include <map>
          #include <stdexcept>
          #include <string>

          class NA6PTGeoHelper {
           public:
            static NA6PTGeoHelper& instance() {
              static NA6PTGeoHelper inst;
              return inst;
            }
            auto& getMatPool() { return matPool; }
            auto& getMedPool() { return medPool; }
            void addMedium(const std::string& name) {
              auto it = matPool.find(name);
              if (it == matPool.end()) throw std::runtime_error("missing material " + name);
              medPool[name] = new TGeoMedium(name, it->second);
            }
            TGeoMedium* getMedium(const std::string& name) {
              auto it = medPool.find(name);
              if (it == medPool.end()) throw std::runtime_error("missing medium " + name);
              return it->second;
            }
           private:
            std::map<std::string, TGeoMaterial*> matPool;
            std::map<std::string, TGeoMedium*> medPool;
          };
          EOF

          cat > /tmp/mwpc_geometry_smoke.cpp <<'EOF'
          #include "NA6PMWPCChamber.h"
          #include "NA6PModule.h"
          #include "NA6PTGeoHelper.h"
          #include "TGeoManager.h"

          #include <array>
          #include <cmath>
          #include <iostream>
          #include <stdexcept>
          #include <string>
          #include <vector>

          struct Expected {
            const char* name;
            const char* medium;
            std::array<double, 3> size;
            std::array<double, 3> centre;
            bool sensitive;
          };

          static bool close(double a, double b, double eps = 1.e-9) {
            return std::abs(a - b) <= eps;
          }

          static const std::vector<Expected> expected = {
            {"OuterSkinFront", "FR4", {53.2,68.56,0.015}, {0.,0.,-0.9567}, false},
            {"OuterSkinBack", "FR4", {53.2,68.56,0.015}, {0.,0.,0.9567}, false},
            {"HoneycombFront", "Honeycomb", {53.0,68.36,0.6}, {0.,0.,-0.6492}, false},
            {"HCWallXMinusFront", "FR4", {0.1,68.56,0.6}, {-26.55,0.,-0.6492}, false},
            {"HCWallXPlusFront", "FR4", {0.1,68.56,0.6}, {26.55,0.,-0.6492}, false},
            {"HCWallYMinusFront", "FR4", {53.0,0.1,0.6}, {0.,-34.23,-0.6492}, false},
            {"HCWallYPlusFront", "FR4", {53.0,0.1,0.6}, {0.,34.23,-0.6492}, false},
            {"HoneycombBack", "Honeycomb", {53.0,68.36,0.6}, {0.,0.,0.6492}, false},
            {"HCWallXMinusBack", "FR4", {0.1,68.56,0.6}, {-26.55,0.,0.6492}, false},
            {"HCWallXPlusBack", "FR4", {0.1,68.56,0.6}, {26.55,0.,0.6492}, false},
            {"HCWallYMinusBack", "FR4", {53.0,0.1,0.6}, {0.,-34.23,0.6492}, false},
            {"HCWallYPlusBack", "FR4", {53.0,0.1,0.6}, {0.,34.23,0.6492}, false},
            {"ReadoutBoardBlue", "FR4", {60.0,67.0,0.08}, {3.4,0.,-0.3092}, false},
            {"ReadoutCopper", "Copper", {60.0,67.0,0.0017}, {3.4,0.,-0.26835}, false},
            {"Gas", "ArCO2", {51.2,66.56,0.6}, {0.,0.,0.0325}, true},
            {"InnerFrameXMinus", "FR4", {1.0,68.56,0.6}, {-26.1,0.,0.0325}, false},
            {"InnerFrameXPlus", "FR4", {1.0,68.56,0.6}, {26.1,0.,0.0325}, false},
            {"InnerFrameYMinus", "FR4", {51.2,1.0,0.6}, {0.,-33.78,0.0325}, false},
            {"InnerFrameYPlus", "FR4", {51.2,1.0,0.6}, {0.,33.78,0.0325}, false},
            {"ChamberCover", "FR4", {53.2,68.56,0.015}, {0.,0.,0.34}, false},
            {"CoverCopper", "Copper", {53.2,68.56,0.0017}, {0.,0.,0.34835}, false},
            {"GreenExternalStripApproximation", "FR4", {53.0,4.0,0.2}, {0.,-36.28,-0.1675}, false}
          };

          int main() {
            TGeoManager manager;
            gGeoManager = &manager;
            NA6PModule module;
            TGeoVolume world("World");
            NA6PMWPCChamber chamber(module, {"FR4", "Copper", "Honeycomb", "ArCO2"});
            auto* assembly = chamber.addTo(&world, 7, 0, {0.,0.,0.});

            if (!assembly) throw std::runtime_error("no chamber assembly returned");
            if (assembly->nodes.size() != expected.size()) {
              throw std::runtime_error("unexpected part count");
            }
            if (world.nodes.size() != 1 || world.nodes.front().volume != assembly) {
              throw std::runtime_error("chamber was not attached to parent volume");
            }

            for (size_t i = 0; i < expected.size(); ++i) {
              const auto& node = assembly->nodes[i];
              const auto& e = expected[i];
              const std::string wantedName = std::string("MWPCChamber_7_") + e.name;
              if (node.volume->name != wantedName) throw std::runtime_error("name mismatch at part " + std::to_string(i));
              if (!node.volume->medium || node.volume->medium->name != e.medium) {
                throw std::runtime_error("medium mismatch at part " + std::to_string(i));
              }
              const std::array<double,3> size{2.*node.volume->hx, 2.*node.volume->hy, 2.*node.volume->hz};
              const std::array<double,3> centre{node.translation->x, node.translation->y, node.translation->z};
              for (int axis = 0; axis < 3; ++axis) {
                if (!close(size[axis], e.size[axis]) || !close(centre[axis], e.centre[axis])) {
                  throw std::runtime_error("geometry mismatch at part " + std::to_string(i));
                }
              }
              const bool isSensitive = node.copyID == module.composeSensorVolID(7);
              if (isSensitive != e.sensitive) throw std::runtime_error("sensitivity mismatch at part " + std::to_string(i));
            }

            const auto gasSize = chamber.gasFullSize();
            const auto gasCentre = chamber.gasCentre();
            const auto envelope = chamber.envelopeFullSize();
            const std::array<double,3> wantedGas{51.2,66.56,0.6};
            const std::array<double,3> wantedGasCentre{0.,0.,0.0325};
            const std::array<double,3> wantedEnvelope{60.0,72.56,1.9284};
            for (int axis=0; axis<3; ++axis) {
              if (!close(gasSize[axis], wantedGas[axis]) ||
                  !close(gasCentre[axis], wantedGasCentre[axis]) ||
                  !close(envelope[axis], wantedEnvelope[axis])) {
                throw std::runtime_error("public geometry helper mismatch");
              }
            }

            auto& pool = NA6PTGeoHelper::instance().getMatPool();
            auto it = pool.find("ArCO2");
            if (it == pool.end()) throw std::runtime_error("ArCO2 material missing");
            auto* gas = dynamic_cast<TGeoMixture*>(it->second);
            if (!gas || gas->elements.size() != 3) throw std::runtime_error("ArCO2 mixture not defined as Ar/C/O");
            const double expectedDensity = 0.0017113385991111801;
            if (!close(gas->density, expectedDensity, 1.e-12)) throw std::runtime_error("gas density mismatch");
            const std::array<double,3> wantedWeights{0.6792813079583009,0.08752782909383734,0.23319086294786168};
            for (int i=0; i<3; ++i) {
              if (!close(gas->elements[static_cast<size_t>(i)].weight, wantedWeights[static_cast<size_t>(i)], 1.e-12)) {
                throw std::runtime_error("gas mass-fraction mismatch");
              }
            }

            std::cout << "PASS: actual NA6PMWPCChamber.cxx compiled and reproduced the 22-part reference chamber\n";
            std::cout << "gas = 51.2 x 66.56 x 0.6 cm, z = 0.0325 cm\n";
            std::cout << "envelope = 60.0 x 72.56 x 1.9284 cm\n";
            std::cout << "Ar/CO2 material density = " << gas->density << " g/cm^3\n";
            return 0;
          }
          EOF

          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I"$STUBS" -Isim/include \
            sim/src/NA6PMWPCParam.cxx \
            sim/src/NA6PMWPCChamber.cxx \
            /tmp/mwpc_geometry_smoke.cpp \
            -o /tmp/mwpc_geometry_smoke

          /tmp/mwpc_geometry_smoke

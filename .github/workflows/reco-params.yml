name: Reconstruction parameters

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reco-params:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parameter validator
        run: python3 -m unittest discover -s test/ci -p 'test_*.py'
      - name: Validate parameter files
        run: bash test/ci/runRecoParams.sh
